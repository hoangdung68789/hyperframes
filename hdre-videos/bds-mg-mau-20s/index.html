<!doctype html>
<html lang="vi" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/js/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Be Vietnam Pro";
        src: url("assets/fonts/BeVietnamPro-ExtraBold.ttf") format("truetype");
        font-weight: 800;
      }
      @font-face {
        font-family: "Be Vietnam Pro";
        src: url("assets/fonts/BeVietnamPro-SemiBold.ttf") format("truetype");
        font-weight: 600;
      }
      :root {
        --ground: #0d1826;
        --ground-2: #13243a;
        --ink: #ffffff;
        --gold: #f2c14e;
        --gold-deep: #d99a1e;
        --line: rgba(242, 193, 78, 0.95);
        --grid: rgba(255, 255, 255, 0.045);
        --muted: rgba(255, 255, 255, 0.72);
        --pink: #ff8fb3;
        --font-display: "Be Vietnam Pro", sans-serif;
        --shadow: 0 6px 24px rgba(0, 0, 0, 0.55);
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: radial-gradient(120% 70% at 50% 38%, var(--ground-2) 0%, var(--ground) 70%);
        font-family: var(--font-display);
        color: var(--ink);
      }
      /* blueprint grid: static ground shared by every scene */
      #grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(var(--grid) 2px, transparent 2px),
          linear-gradient(90deg, var(--grid) 2px, transparent 2px);
        background-size: 90px 90px;
        background-position: 0 30px;
      }
      .scene {
        position: absolute;
        inset: 0;
      }
      .txt {
        position: absolute;
        left: 0;
        width: 1080px;
        text-align: center;
        text-shadow: var(--shadow);
        white-space: nowrap;
      }
      .h1 {
        font-weight: 800;
        font-size: 96px;
        line-height: 1.05;
        letter-spacing: -0.01em;
      }
      .h2 {
        font-weight: 600;
        font-size: 50px;
        line-height: 1.2;
        color: var(--muted);
      }
      .gold {
        color: var(--gold);
      }
      .word {
        display: inline-block;
      }
      svg {
        position: absolute;
        overflow: visible;
      }
      .draw {
        fill: none;
        stroke: var(--line);
        stroke-width: 5;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
      }
      .thin {
        stroke-width: 3;
        stroke: rgba(255, 255, 255, 0.75);
      }

      /* S1 hook */
      #s1-price {
        top: 820px;
        font-weight: 800;
        font-size: 210px;
        line-height: 1;
        color: var(--gold);
        font-variant-numeric: tabular-nums;
      }
      #s1-price .unit {
        font-size: 120px;
        margin-left: 18px;
      }
      #s1-underline {
        left: 330px;
        top: 1080px;
      }

      /* S2 house */
      #house {
        left: 300px;
        top: 360px;
      }
      .floor-glow {
        position: absolute;
        left: 330px;
        width: 420px;
        height: 150px;
        background: linear-gradient(180deg, rgba(242, 193, 78, 0.22), rgba(242, 193, 78, 0.02));
        opacity: 0;
      }
      .chip {
        position: absolute;
        font-weight: 800;
        font-size: 64px;
        white-space: nowrap;
        text-shadow: var(--shadow);
      }
      .chip .dot {
        display: inline-block;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--gold);
        margin-right: 20px;
        vertical-align: middle;
        transform: translateY(-6px);
      }

      /* S3 plan */
      #plan {
        left: 240px;
        top: 360px;
      }
      .dim {
        position: absolute;
        font-weight: 800;
        font-size: 64px;
        color: var(--ink);
        text-shadow: var(--shadow);
        white-space: nowrap;
      }
      #s3-area {
        position: absolute;
        left: 540px;
        top: 770px;
        font-weight: 800;
        font-size: 130px;
        color: var(--gold);
        text-shadow: var(--shadow);
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }
      #s3-area sup {
        font-size: 70px;
      }

      /* S4 map */
      #map {
        left: 0;
        top: 230px;
      }
      .road {
        fill: none;
        stroke: rgba(255, 255, 255, 0.16);
        stroke-width: 14;
        stroke-linecap: round;
      }
      .road.main {
        stroke: rgba(242, 193, 78, 0.55);
        stroke-width: 26;
      }
      .poi {
        position: absolute;
        width: 140px;
        text-align: center;
        opacity: 0;
      }
      .poi .ic {
        width: 92px;
        height: 92px;
        margin: 0 auto 10px;
        border-radius: 50%;
        border: 5px solid var(--gold);
        display: grid;
        place-items: center;
        background: var(--ground);
      }
      .poi .lb {
        font-weight: 800;
        font-size: 40px;
        white-space: nowrap;
        margin-left: -40px;
        width: 220px;
        text-shadow: var(--shadow);
      }
      #pin {
        position: absolute;
        left: 490px;
        top: 700px;
        width: 100px;
        height: 130px;
      }

      /* S5 legal */
      #stamp {
        position: absolute;
        left: 230px;
        top: 620px;
        width: 620px;
        height: 330px;
        border: 12px solid var(--pink);
        border-radius: 36px;
        display: grid;
        place-items: center;
        color: var(--pink);
        font-weight: 800;
        font-size: 96px;
        line-height: 1.02;
        text-align: center;
        opacity: 0;
      }
      #stamp::after {
        content: "";
        position: absolute;
        inset: 14px;
        border: 4px solid var(--pink);
        border-radius: 24px;
      }

      /* S6 CTA */
      .ring {
        position: absolute;
        left: 420px;
        top: 560px;
        width: 240px;
        height: 240px;
        border-radius: 50%;
        border: 6px solid var(--gold);
        opacity: 0;
      }
      #cta-icon {
        position: absolute;
        left: 450px;
        top: 590px;
        width: 180px;
        height: 180px;
        border-radius: 50%;
        background: var(--gold);
        display: grid;
        place-items: center;
      }

      #flash {
        position: absolute;
        inset: 0;
        background: radial-gradient(60% 45% at 50% 45%, #fff6dc 0%, rgba(242, 193, 78, 0.7) 45%, rgba(242, 193, 78, 0) 100%);
        opacity: 0;
        pointer-events: none;
      }
      #wipe {
        position: absolute;
        inset: 0;
        background: var(--gold);
        clip-path: inset(0 100% 0 0);
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="20"
      data-width="1080"
      data-height="1920"
    >
      <div id="grid"></div>

      <!-- S1 · 0–4s · Hook: kiểu nhà + giá -->
      <div id="s1" class="scene clip" data-start="0" data-duration="4" data-track-index="1">
        <div id="s1-l1" class="txt h1" style="top: 560px">
          <span class="word">NHÀ</span> <span class="word">PHỐ</span>
        </div>
        <div id="s1-l2" class="txt h1 gold" style="top: 670px">
          <span class="word">HẺM</span> <span class="word">XE</span> <span class="word">HƠI</span>
        </div>
        <div id="s1-price" class="txt"><span id="s1-num">0,0</span><span class="unit">TỶ</span></div>
        <svg id="s1-underline" width="420" height="30" viewBox="0 0 420 30">
          <path class="draw" pathLength="1" d="M10 18 Q 210 4 410 18" style="stroke-width: 9" />
        </svg>
        <div id="s1-area" class="txt h2" style="top: 1150px">Khu vực Quận 10</div>
      </div>

      <!-- S2 · 4–8s · Mặt tiền vẽ nét + kết cấu -->
      <div id="s2" class="scene clip" data-start="4" data-duration="4" data-track-index="2">
        <div class="floor-glow" id="fg1" style="top: 960px"></div>
        <div class="floor-glow" id="fg2" style="top: 810px"></div>
        <div class="floor-glow" id="fg3" style="top: 660px"></div>
        <div class="floor-glow" id="fg4" style="top: 510px"></div>
        <svg id="house" width="480" height="760" viewBox="0 0 480 760">
          <!-- roof + outline -->
          <path class="draw" pathLength="1" d="M10 150 L240 40 L470 150" />
          <path class="draw" pathLength="1" d="M30 150 L30 750 L450 750 L450 150 Z" />
          <!-- floor slabs -->
          <path class="draw" pathLength="1" d="M30 300 L450 300 M30 450 L450 450 M30 600 L450 600" />
          <!-- windows -->
          <path class="draw thin" pathLength="1" d="M80 180 h320 v90 h-320 Z" />
          <path class="draw thin" pathLength="1" d="M80 330 h320 v90 h-320 Z" />
          <path class="draw thin" pathLength="1" d="M80 480 h320 v90 h-320 Z" />
          <!-- balconies -->
          <path class="draw thin" pathLength="1" d="M60 300 v-28 M110 300 v-28 M160 300 v-28 M210 300 v-28 M260 300 v-28 M310 300 v-28 M360 300 v-28 M410 300 v-28 M60 272 H420" />
          <path class="draw thin" pathLength="1" d="M60 450 v-28 M110 450 v-28 M160 450 v-28 M210 450 v-28 M260 450 v-28 M310 450 v-28 M360 450 v-28 M410 450 v-28 M60 422 H420" />
          <!-- ground floor door -->
          <path class="draw thin" pathLength="1" d="M90 750 V640 H390 V750 M240 640 V750" />
        </svg>
        <div id="s2-c1" class="chip" style="left: 290px; top: 1180px"><span class="dot"></span>1 trệt · 3 lầu</div>
        <div id="s2-c2" class="chip" style="left: 290px; top: 1290px"><span class="dot"></span>4 PN · 5 WC</div>
      </div>

      <!-- S3 · 8–12s · Mặt bằng + thước đo -->
      <div id="s3" class="scene clip" data-start="8" data-duration="4" data-track-index="3">
        <svg id="plan" width="260" height="960" viewBox="0 0 260 960">
          <!-- ruler top: 4m -->
          <path class="draw" pathLength="1" d="M20 30 H240 M20 14 V46 M240 14 V46" id="ruler-w" />
          <!-- outline 4×16 -->
          <path class="draw" pathLength="1" d="M20 80 H240 V940 H20 Z" />
          <!-- rooms -->
          <path class="draw thin" pathLength="1" d="M20 300 H240 M20 560 H160 M160 560 V720 M20 720 H240" />
          <!-- ruler side: 16m -->
          <path class="draw" pathLength="1" d="M-40 80 V940 M-56 80 H-24 M-56 940 H-24" id="ruler-h" />
        </svg>
        <div id="s3-w" class="dim" style="left: 320px; top: 280px">4 m</div>
        <div id="s3-h" class="dim" style="left: 30px; top: 800px">16 m</div>
        <div id="s3-area"><span id="s3-num">0</span> m<sup>2</sup></div>
        <div id="s3-lbl" class="h2" style="position: absolute; left: 548px; top: 935px; color: var(--muted)">diện tích đất</div>
      </div>

      <!-- S4 · 12–16s · Vị trí + tiện ích -->
      <div id="s4" class="scene clip" data-start="12" data-duration="4" data-track-index="4">
        <svg id="map" width="1080" height="1220" viewBox="0 0 1080 1220">
          <path d="M-40 980 C 220 900 380 1060 640 980 S 980 860 1120 920" fill="none" stroke="rgba(110,170,230,0.35)" stroke-width="60" stroke-linecap="round" />
          <ellipse cx="830" cy="300" rx="120" ry="80" fill="rgba(120,190,130,0.22)" />
          <path class="road" d="M-20 380 H1100" />
          <path class="road" d="M180 -20 V1240" />
          <path class="road" d="M760 -20 V1240" />
          <path class="road" d="M-20 760 H1100" />
          <path class="road main draw-road" pathLength="1" d="M-20 560 C 300 540 700 620 1100 520" style="stroke-dasharray: 1; stroke-dashoffset: 1" />
          <path class="road main draw-road" pathLength="1" d="M520 -20 C 500 300 560 700 500 1240" style="stroke-dasharray: 1; stroke-dashoffset: 1" />
          <circle id="radius" cx="540" cy="600" r="380" fill="rgba(242,193,78,0.06)" stroke="var(--gold)" stroke-width="4" stroke-dasharray="14 14" />
        </svg>
        <svg id="pin" viewBox="0 0 100 130">
          <path d="M50 126 C 50 126 8 74 8 46 A 42 42 0 1 1 92 46 C 92 74 50 126 50 126 Z" fill="var(--gold)" />
          <circle cx="50" cy="46" r="16" fill="var(--ground)" />
        </svg>
        <div id="s4-r" class="h2" style="position: absolute; left: 600px; top: 1180px; color: var(--gold)">bán kính 2 km</div>
        <div class="poi" data-layout-allow-overflow id="poi1" style="left: 160px; top: 470px">
          <div class="ic">
            <svg width="44" height="44" viewBox="0 0 44 44" style="position: static"><path d="M16 4h12v12h12v12H28v12H16V28H4V16h12z" fill="var(--gold)" /></svg>
          </div>
          <div class="lb">Bệnh viện</div>
        </div>
        <div class="poi" data-layout-allow-overflow id="poi2" style="left: 760px; top: 640px">
          <div class="ic">
            <svg width="48" height="44" viewBox="0 0 48 44" style="position: static"><path d="M2 6h8l6 24h24l5-16H14" fill="none" stroke="var(--gold)" stroke-width="5" stroke-linejoin="round" /><circle cx="19" cy="38" r="4" fill="var(--gold)" /><circle cx="37" cy="38" r="4" fill="var(--gold)" /></svg>
          </div>
          <div class="lb">Siêu thị</div>
        </div>
        <div class="poi" data-layout-allow-overflow id="poi3" style="left: 250px; top: 860px">
          <div class="ic">
            <svg width="52" height="40" viewBox="0 0 52 40" style="position: static"><path d="M26 2 50 14 26 26 2 14z" fill="var(--gold)" /><path d="M12 20v10c8 8 20 8 28 0V20" fill="none" stroke="var(--gold)" stroke-width="5" /></svg>
          </div>
          <div class="lb">Trường học</div>
        </div>
      </div>

      <!-- S5 · 16–18s · Pháp lý -->
      <div id="s5" class="scene clip" data-start="16" data-duration="1.8" data-track-index="5">
        <div id="stamp">SỔ HỒNG<br />RIÊNG</div>
        <div id="s5-sub" class="txt h1" style="top: 1080px; font-size: 76px">Hoàn công đủ</div>
        <svg id="s5-hl" width="520" height="24" viewBox="0 0 520 24" style="left: 280px; top: 1185px">
          <path class="draw" pathLength="1" d="M8 12 H512" style="stroke-width: 14; stroke: rgba(242, 193, 78, 0.9)" />
        </svg>
      </div>

      <!-- S6 · 18–20s · CTA -->
      <div id="s6" class="scene clip" data-start="17.8" data-duration="2.2" data-track-index="6">
        <div class="ring" id="ring1"></div>
        <div class="ring" id="ring2"></div>
        <div id="cta-icon">
          <svg width="96" height="88" viewBox="0 0 96 88" style="position: static">
            <path d="M8 8h80v52H40L20 80V60H8z" fill="var(--ground)" stroke="var(--ground)" stroke-width="6" stroke-linejoin="round" />
            <circle cx="30" cy="34" r="6" fill="var(--gold)" /><circle cx="48" cy="34" r="6" fill="var(--gold)" /><circle cx="66" cy="34" r="6" fill="var(--gold)" />
          </svg>
        </div>
        <div id="s6-t" class="txt h1" style="top: 900px">
          <span class="word">NHẮN</span> <span class="word">TIN</span> <span class="word gold">NGAY</span>
        </div>
      </div>

      <div id="flash"></div>
      <div id="wipe"></div>

      <!-- Nhạc nền: "Emulsified – Chill EDM", Abstraction (Ben Burnes), CC0 -->
      <audio id="music" src="assets/audio/music.wav" data-start="0" data-duration="20" data-track-index="10" data-volume="0.55"></audio>

      <!-- SFX: mỗi chữ/MG một âm, lệch ≤ 1 khung so với lúc chữ hiện -->
      <audio id="sfx-01" src="assets/audio/pop.wav" data-start="0.15" data-duration="0.68" data-track-index="11" data-volume="0.8"></audio>
      <audio id="sfx-02" src="assets/audio/impact-bass-1.wav" data-start="0.7" data-duration="1.2" data-track-index="12" data-volume="0.75"></audio>
      <audio id="sfx-03" src="assets/audio/tick-roll.wav" data-start="1.5" data-duration="1.05" data-track-index="11" data-volume="0.55"></audio>
      <audio id="sfx-04" src="assets/audio/coins-land.wav" data-start="2.6" data-duration="0.2" data-track-index="12" data-volume="1"></audio>
      <audio id="sfx-05" src="assets/audio/chime.wav" data-start="2.62" data-duration="1.2" data-track-index="13" data-volume="0.45"></audio>
      <audio id="sfx-06" src="assets/audio/click-soft.wav" data-start="1.1" data-duration="0.32" data-track-index="11" data-volume="0.5"></audio>
      <audio id="sfx-07" src="assets/audio/whoosh.wav" data-start="3.82" data-duration="0.51" data-track-index="12" data-volume="0.8"></audio>
      <audio id="sfx-08" src="assets/audio/pen-lines.wav" data-start="4.25" data-duration="0.86" data-track-index="11" data-volume="0.75"></audio>
      <audio id="sfx-09" src="assets/audio/click.wav" data-start="6.0" data-duration="0.32" data-track-index="12" data-volume="0.75"></audio>
      <audio id="sfx-10" src="assets/audio/key-press.wav" data-start="6.6" data-duration="0.33" data-track-index="11" data-volume="0.8"></audio>
      <audio id="sfx-11" src="assets/audio/swish2.wav" data-start="7.8" data-duration="0.51" data-track-index="12" data-volume="0.85"></audio>
      <audio id="sfx-12" src="assets/audio/pen-lines.wav" data-start="8.35" data-duration="0.86" data-track-index="11" data-volume="0.6"></audio>
      <audio id="sfx-13" src="assets/audio/click-soft.wav" data-start="9.0" data-duration="0.32" data-track-index="12" data-volume="0.6"></audio>
      <audio id="sfx-14" src="assets/audio/click.wav" data-start="9.6" data-duration="0.32" data-track-index="11" data-volume="0.6"></audio>
      <audio id="sfx-15" src="assets/audio/chime.wav" data-start="10.9" data-duration="1.0" data-track-index="12" data-volume="0.5"></audio>
      <audio id="sfx-16" src="assets/audio/classic-swish.wav" data-start="11.78" data-duration="0.34" data-track-index="11" data-volume="0.85"></audio>
      <audio id="sfx-17" src="assets/audio/ping.wav" data-start="12.45" data-duration="1.0" data-track-index="12" data-volume="0.7"></audio>
      <audio id="sfx-18" src="assets/audio/sparkle.wav" data-start="12.85" data-duration="1.2" data-track-index="11" data-volume="0.4"></audio>
      <audio id="sfx-19" src="assets/audio/pop.wav" data-start="13.6" data-duration="0.68" data-track-index="13" data-volume="0.7"></audio>
      <audio id="sfx-20" src="assets/audio/key-press.wav" data-start="14.1" data-duration="0.33" data-track-index="12" data-volume="0.75"></audio>
      <audio id="sfx-21" src="assets/audio/tap.wav" data-start="14.6" data-duration="0.8" data-track-index="11" data-volume="0.8"></audio>
      <audio id="sfx-22" src="assets/audio/whoosh-cinematic.wav" data-start="15.7" data-duration="0.9" data-track-index="12" data-volume="0.6"></audio>
      <audio id="sfx-23" src="assets/audio/stamp.wav" data-start="16.32" data-duration="0.78" data-track-index="11" data-volume="1"></audio>
      <audio id="sfx-24" src="assets/audio/impact-bass-2.wav" data-start="16.32" data-duration="1.2" data-track-index="13" data-volume="0.6"></audio>
      <audio id="sfx-25" src="assets/audio/whoosh-short.wav" data-start="16.38" data-duration="0.51" data-track-index="14" data-volume="0.5"></audio>
      <audio id="sfx-26" src="assets/audio/swish5.wav" data-start="17.6" data-duration="0.32" data-track-index="11" data-volume="0.85"></audio>
      <audio id="sfx-27" src="assets/audio/notification.wav" data-start="17.92" data-duration="1.6" data-track-index="12" data-volume="0.7"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const q = (s) => document.querySelectorAll(s);

      // ---------- S1 · Hook (0–4s) ----------
      const l1 = q("#s1-l1 .word");
      const l2 = q("#s1-l2 .word");
      tl.from(l1, { y: 60, scale: 0.6, opacity: 0, duration: 0.35, stagger: 0.12, ease: "back.out(2.4)" }, 0.12);
      tl.from(l2, { y: 60, scale: 0.6, opacity: 0, duration: 0.35, stagger: 0.1, ease: "back.out(2.4)" }, 0.66);
      tl.to("#s1-l2", { scale: 1.08, duration: 0.12, ease: "power2.out", transformOrigin: "50% 50%" }, 1.02);
      tl.to("#s1-l2", { scale: 1, duration: 0.25, ease: "power2.inOut" }, 1.14);

      const num = document.getElementById("s1-num");
      const price = { v: 0 };
      const showPrice = () => (num.textContent = price.v.toFixed(1).replace(".", ","));
      showPrice();
      tl.from("#s1-price", { y: 80, opacity: 0, duration: 0.3, ease: "power3.out" }, 1.45);
      tl.to(price, { v: 8.5, duration: 1.15, ease: "power3.out", onUpdate: showPrice }, 1.5);
      tl.to("#s1-price", { scale: 1.12, duration: 0.1, ease: "power2.out" }, 2.6);
      tl.to("#s1-price", { scale: 1, duration: 0.3, ease: "back.out(3)" }, 2.7);
      tl.to("#s1-underline path", { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, 2.65);
      tl.from("#s1-area", { y: 30, opacity: 0, duration: 0.3, ease: "power3.out" }, 1.1);
      // exit: whip up
      tl.to("#s1", { y: -420, opacity: 0, filter: "blur(18px)", duration: 0.22, ease: "power4.in" }, 3.78);

      // ---------- S2 · Facade draw (4–8s) ----------
      tl.from("#s2", { y: 420, filter: "blur(18px)", duration: 0.3, ease: "power4.out" }, 4.0);
      const housePaths = q("#house .draw");
      tl.to(housePaths, { strokeDashoffset: 0, duration: 0.7, stagger: 0.09, ease: "power2.inOut" }, 4.2);
      ["#fg1", "#fg2", "#fg3", "#fg4"].forEach((id, i) => {
        tl.to(id, { opacity: 1, duration: 0.25, ease: "power2.out" }, 5.4 + i * 0.14);
      });
      tl.from("#s2-c1", { x: -80, opacity: 0, duration: 0.35, ease: "back.out(2)" }, 5.98);
      tl.from("#s2-c2", { x: -80, opacity: 0, duration: 0.35, ease: "back.out(2)" }, 6.58);
      // exit: zoom-through into the house
      tl.to("#s2", { scale: 3.2, opacity: 0, filter: "blur(16px)", duration: 0.24, ease: "power4.in", transformOrigin: "50% 45%" }, 7.76);

      // ---------- S3 · Plan + rulers (8–12s) ----------
      tl.from("#s3", { scale: 0.35, opacity: 0, filter: "blur(16px)", duration: 0.3, ease: "power4.out", transformOrigin: "50% 45%" }, 8.0);
      const planPaths = q("#plan .draw");
      tl.to(planPaths[1], { strokeDashoffset: 0, duration: 0.7, ease: "power2.inOut" }, 8.3);
      tl.to(planPaths[2], { strokeDashoffset: 0, duration: 0.5, ease: "power2.inOut" }, 8.7);
      tl.to(planPaths[0], { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, 8.85);
      tl.from("#s3-w", { y: 40, opacity: 0, duration: 0.3, ease: "back.out(2)" }, 8.98);
      tl.to(planPaths[3], { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" }, 9.3);
      tl.from("#s3-h", { y: 40, opacity: 0, duration: 0.3, ease: "back.out(2)" }, 9.58);
      const area = { v: 0 };
      const areaEl = document.getElementById("s3-num");
      tl.from("#s3-area", { x: 60, opacity: 0, duration: 0.3, ease: "power3.out" }, 10.1);
      tl.to(area, { v: 64, duration: 0.8, ease: "power2.out", onUpdate: () => (areaEl.textContent = Math.round(area.v)) }, 10.1);
      tl.to("#s3-area", { scale: 1.1, duration: 0.1, ease: "power2.out" }, 10.88);
      tl.to("#s3-area", { scale: 1, duration: 0.3, ease: "back.out(3)" }, 10.98);
      tl.from("#s3-lbl", { opacity: 0, y: 20, duration: 0.3 }, 10.2);
      // exit: gold mask wipe left → right
      tl.to("#wipe", { clipPath: "inset(0 0% 0 0)", duration: 0.22, ease: "power3.in" }, 11.78);
      tl.to("#wipe", { clipPath: "inset(0 0 0 100%)", duration: 0.3, ease: "power3.out" }, 12.0);

      // ---------- S4 · Map (12–16s) ----------
      tl.to("#s4 .draw-road", { strokeDashoffset: 0, duration: 0.8, stagger: 0.15, ease: "power2.inOut" }, 12.05);
      tl.from("#pin", { y: -500, duration: 0.42, ease: "bounce.out" }, 12.05);
      tl.from("#radius", { scale: 0, opacity: 0, duration: 0.6, ease: "power3.out", transformOrigin: "540px 600px" }, 12.85);
      tl.from("#s4-r", { opacity: 0, x: 40, duration: 0.3 }, 13.1);
      tl.to("#poi1", { opacity: 1, duration: 0.01 }, 13.6);
      tl.from("#poi1", { scale: 0.3, duration: 0.35, ease: "back.out(2.5)" }, 13.6);
      tl.to("#poi2", { opacity: 1, duration: 0.01 }, 14.1);
      tl.from("#poi2", { scale: 0.3, duration: 0.35, ease: "back.out(2.5)" }, 14.1);
      tl.to("#poi3", { opacity: 1, duration: 0.01 }, 14.6);
      tl.from("#poi3", { scale: 0.3, duration: 0.35, ease: "back.out(2.5)" }, 14.6);
      // exit: light flash
      tl.to("#flash", { opacity: 1, duration: 0.25, ease: "power2.in" }, 15.75);
      tl.to("#flash", { opacity: 0, duration: 0.4, ease: "power2.out" }, 16.0);

      // ---------- S5 · Legal stamp (16–18s) ----------
      tl.set("#stamp", { rotation: -8, scale: 2.4, opacity: 0 }, 16.0);
      tl.to("#stamp", { scale: 1, opacity: 1, duration: 0.32, ease: "power4.in" }, 16.0);
      tl.to("#s5", { x: 10, duration: 0.04, yoyo: true, repeat: 3, ease: "none" }, 16.32);
      tl.from("#s5-sub", { y: 40, opacity: 0, duration: 0.3, ease: "power3.out" }, 16.4);
      tl.to("#s5-hl path", { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, 16.55);
      // exit: push left
      tl.to("#s5", { x: -1080, duration: 0.2, ease: "power4.in" }, 17.6);

      // ---------- S6 · CTA (18–20s) ----------
      tl.from("#s6", { x: 1080, duration: 0.26, ease: "power4.out" }, 17.8);
      tl.from("#cta-icon", { scale: 0, duration: 0.4, ease: "back.out(2.6)" }, 17.95);
      tl.from("#s6-t .word", { y: 50, opacity: 0, duration: 0.3, stagger: 0.1, ease: "back.out(2)" }, 17.9);
      [
        ["#ring1", 18.35],
        ["#ring2", 18.95],
      ].forEach(([id, t]) => {
        tl.fromTo(id, { scale: 0.75, opacity: 0.9 }, { scale: 1.7, opacity: 0, duration: 0.9, ease: "power2.out" }, t);
      });
      tl.to("#s6-t", { scale: 1.06, duration: 0.18, yoyo: true, repeat: 1, ease: "power1.inOut" }, 19.0);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
